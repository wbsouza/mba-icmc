# Strategy "news-only" (Experiment 3 — docs/experiments.md): the news family alone decides.
# extends: baseline, but the chain carries no price filter: F1/F2/F3 are left out of
# `filters:` and their inherited `indicator:` / `pattern:` sections are dropped (a
# top-level `null` removes an inherited section; a section without its filter is
# otherwise a hard stop). F4 vetoes on an active high-risk GDELT event, F5 and F6 keep
# the trade viable, and F7's meta-learner is trained on the `news` family only
# (`scripts/train_hybrid_meta_learner.py --strategy news-only --out <model>`), so p_hat
# comes from `news_event_intensity` (+ `news_sentiment_score`, best-effort pending
# TD-48) and nothing else. F7's PATTERN family is simply not declared; the engine still
# computes the ATR and swing readings F6's stop-distance sources need, so the swing
# stop works without F1–F3. The regime gate must stay off: F1's `trend_score` is absent.
#
# Decision bars are H1 (price_features.bar_minutes 60) with a one-bar label horizon.
# risk_guard and capital_mgmt carry the Heikin-Ashi H4 template's risk/exit settings
# (experiments/heikin-ashi-signals/strategies/heikin-ashi-h4-talib-volume-off/config.yaml):
# 18 % account-risk cap, swing stop shrunk 50 %, targets at 4R/6R closing half each, one
# trail step armed at 2R moving the stop to +0.1R. `news-only-h4` restates only the H4
# clock (bar_minutes / label_horizon_minutes 240).
schema_version: 2
extends: baseline
perception_source: ema

filters:
  - f4_news_context
  - f5_risk_guard
  - f6_capital_mgmt
  - f7_meta_learner

# F2/F3 are not in the chain: drop the sections baseline declares for them.
indicator: null
pattern: null

price_features:
  bar_minutes: 60

# F4 — news context, the same thresholds as hybrid (Spec 04e).
news_context:
  event_intensity_veto_threshold: -0.5
  sentiment_direction_threshold: 0.15

# F5 — the Heikin-Ashi H4 template's caps.
risk_guard:
  portfolio_at_risk_cap: 0.18
  daily_drawdown_limit: -0.05
  weekly_drawdown_limit: -0.15
  max_concurrent_trades_per_account: 2
  max_leverage: 30

# F6 — the Heikin-Ashi H4 template's risk and exit plan.
capital_mgmt:
  risk_per_trade: 0.03
  stop_distance_source: swing
  stop_loss_pips: 20.0
  pip_value_per_lot: 10.0
  lot_notional_units: 100000
  assumed_leverage: 30
  stop_loss_shrink: 0.50
  min_stop_pips: 5.0
  min_stop_factor: 1.2
  targets:
    - {at_level_ratio: 4.0, close_fraction: 0.5}
    - {at_level_ratio: 6.0, close_fraction: 0.5}
  trail_stops:
    - {at_level_ratio: 2.0, to_level_ratio: 0.1}
  min_reward_risk: 2.0
  atr_multiplier: 2.0

# F7 — the news family alone; the thresholds are baseline's, the gate off (no F1).
meta_learner:
  families: [news]
  theta_high: 0.55
  theta_low: 0.45
  regime_gate: false
  label_horizon_minutes: 60
