# Strategy "hybrid" (Spec 04, Experiment 2 — docs/experiments.md #2): baseline + news.
# extends: baseline adds F4 (news-context) between F3 and F5, per specs.md §11.3.3's
# reference chain diagram, and adds the "news" feature family to the meta-learner
# (PRD.md §1: "hybrid adds the news family" — the two variants "share an identical
# meta-learner specification; the only difference is whether the news-family
# probability enters", monografia §"late-fusion"). filters: is written out in full
# (this module's own merge policy does not diff/insert lists) so the complete chain is
# auditable here without cross-referencing baseline/config.yaml. The F5/F6/F7 sections
# (risk_guard, capital_mgmt incl. the reference trade plan, meta_learner thresholds and gate)
# and the execution costs section are inherited from baseline unchanged, so both variants
# face identical execution assumptions; only F4's own section is added here.
schema_version: 2
extends: baseline

filters:
  - f1_trend
  - f2_indicator
  - f3_pattern
  - f4_news_context
  - f5_risk_guard
  - f6_capital_mgmt
  - f7_meta_learner

# F4 — news context (Spec 04e). event_intensity is the day's mean GDELT Goldstein scale
# (roughly [-10, 10], more negative = more conflictual): at or below the veto threshold
# the bar is an active high-risk event and F4 vetoes. sentiment_direction_threshold is
# the minimum polarity magnitude before F4 recommends a direction (sentiment is
# best-effort pending TD-48). `null` disables either half.
news_context:
  event_intensity_veto_threshold: -0.5
  sentiment_direction_threshold: 0.15

meta_learner:
  families:
    - trend
    - indicator
    - pattern
    - news
