[project]
name = "algo-backtest"
version = "0.0.0"
description = "Materialize Parquet into the durable lean-data store; LightGBM meta-learner + deterministic filter chain on LEAN."
requires-python = ">=3.11"
dependencies = [
    "algo-core",
    "typer>=0.12",
    "testcontainers>=4.14.0",
    "pyyaml>=6",
    "structlog>=24",
]

[project.scripts]
algo-backtest = "algo_backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_backtest"]

[tool.uv.sources]
algo-core = { workspace = true }

[tool.mutmut]
source_paths = ["src"]
# First Hardener pass for this package (filter-chain mechanics, Spec 04b);
# scoped to this story's differential file only. Spec 04c (F1-F3 price filters)
# extends this to its own three new files.
only_mutate = [
    "src/algo_backtest/chain/model.py",
    "src/algo_backtest/chain/filters/f1_trend.py",
    "src/algo_backtest/chain/filters/f2_indicator.py",
    "src/algo_backtest/chain/filters/f3_pattern.py",
]
