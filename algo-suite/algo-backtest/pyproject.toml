[project]
name = "algo-backtest"
version = "0.0.0"
description = "Materialize Parquet into the durable lean-data store; LightGBM meta-learner + deterministic filter chain on LEAN."
requires-python = ">=3.11"
dependencies = [
    "algo-core",
    "typer>=0.12",
    "testcontainers>=4.14.0",
    "pyyaml>=6",
    "structlog>=24",
]

[project.scripts]
algo-backtest = "algo_backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_backtest"]

[tool.uv.sources]
algo-core = { workspace = true }

[tool.mutmut]
source_paths = ["src"]
# First Hardener pass for this package (filter-chain mechanics, Spec 04b);
# scoped to this story's differential file only.
# Spec 04d (risk & capital-management filters F5/F6) extends the scope with its own
# six differential files.
only_mutate = [
    "src/algo_backtest/chain/model.py",
    "src/algo_backtest/rules/risk_math.py",
    "src/algo_backtest/rules/trail_stop.py",
    "src/algo_backtest/rules/close_portion.py",
    "src/algo_backtest/rules/risk_guard.py",
    "src/algo_backtest/chain/filters/f5_risk_guard.py",
    "src/algo_backtest/chain/filters/f6_capital_mgmt.py",
]
