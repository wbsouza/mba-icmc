[project]
name = "algo-backtest"
version = "0.0.0"
description = "Materialize Parquet into the durable lean-data store; LightGBM meta-learner + deterministic filter chain on LEAN."
requires-python = ">=3.11"
dependencies = [
    "algo-core",
    "typer>=0.12",
    "testcontainers>=4.14.0",
    "pyyaml>=6",
    "structlog>=24",
]

[project.scripts]
algo-backtest = "algo_backtest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_backtest"]

[tool.uv.sources]
algo-core = { workspace = true }

[tool.mutmut]
source_paths = ["src"]
# Hardener passes for this package, scoped to each story's differential file(s):
# Spec 04b (filter-chain mechanics), Spec 04f (decisions.parquet audit trail).
only_mutate = [
    "src/algo_backtest/chain/model.py",
    "src/algo_backtest/chain/audit.py",
]
