[project]
name = "algo-score"
version = "0.0.0"
description = "Score sentiment (FinBERT + Loughran-McDonald, per-currency) and events into feature Parquet."
requires-python = ">=3.11"
dependencies = [
    "algo-core",
    "pyarrow>=16",
    "typer>=0.12",
]

[project.scripts]
algo-score = "algo_score.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_score"]

[tool.uv.sources]
algo-core = { workspace = true }

[tool.mutmut]
source_paths = ["src"]
# First Hardener pass for this package (event features + LM lexicon scorer);
# the whole package is this task's differential scope.
only_mutate = [
    "src/algo_score/attribution.py",
    "src/algo_score/bucket.py",
    "src/algo_score/cli.py",
    "src/algo_score/paths.py",
    "src/algo_score/scoring.py",
    "src/algo_score/storage.py",
    "src/algo_score/events/*.py",
    "src/algo_score/scorers/*.py",
]
