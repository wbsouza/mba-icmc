# Backtest experiment spec — the reproducible Chapter-4 experiment contract.
#
# Run (regenerates the same deterministic result set):
#   uv run algo-backtest experiment run --spec experiments/baseline-smoke.yaml
#
# Each run writes runs/experiments/<experiment>/<id>/ (run.json, trades.json,
# metrics.json) and one flat row in runs/experiments/<experiment>/experiment.json.
#
# Requires the window materialized first:
#   uv run algo-backtest materialize --symbol EURUSD --year 2014 --month 5
#
# This is a small, runnable example. The real thesis experiments (EUR/USD + USD/JPY over
# the data-driven 2015-2024 window, specs.md §3) are added here as coverage is nailed.
experiment: baseline-smoke
runs:
  - id: eurusd-2014-05
    strategy: baseline-ma
    symbol: EURUSD
    from: 2014-05-07
    to: 2014-05-09
    params:
      fast: 3
      slow: 8
      size: 0.5
