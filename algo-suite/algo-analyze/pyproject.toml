[project]
name = "algo-analyze"
version = "0.0.0"
description = "Run metrics: DSR probability, paired stationary bootstrap, ablation tables and thesis figures."
requires-python = ">=3.11"
dependencies = [
    "algo-backtest",
    "algo-core",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "typer>=0.12",
    "structlog>=24",
]

[project.scripts]
algo-analyze = "algo_analyze.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_analyze"]

[tool.uv.sources]
algo-backtest = { workspace = true }
algo-core = { workspace = true }

[tool.mutmut]
source_paths = ["src"]
only_mutate = [
    "src/algo_analyze/significance.py",
]
