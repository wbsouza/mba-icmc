# Exploratory Heikin-Ashi H4 template proxy; reference settings and unsupported semantics: ../../README.md.
extends: baseline
schema_version: 2
perception_source: ema
filters:
  - f1_trend
  - f2_indicator
  - f3_pattern
  - f5_risk_guard
  - f6_capital_mgmt
  - f7_meta_learner
price_features:
  bar_minutes: 240
  ema_fast: 3
  ema_slow: 8
  ema_higher_tf: 60
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  swing_lookback_bars: 60
indicator:
  rsi_midline: 50
  macd_hist_threshold: 0
pattern:
  detector: disabled
  bullish_patterns: [bullish_engulfing, hammer, morning_star]
  bearish_patterns: [bearish_engulfing, shooting_star, evening_star]
risk_guard:
  portfolio_at_risk_cap: 0.18
  daily_drawdown_limit: -0.05
  weekly_drawdown_limit: -0.15
  max_concurrent_trades_per_account: 2
  max_leverage: 30
capital_mgmt:
  risk_per_trade: 0.03
  stop_distance_source: swing
  stop_loss_pips: 20.0
  pip_value_per_lot: 10.0
  lot_notional_units: 100000
  assumed_leverage: 30
  stop_loss_shrink: 0.50
  min_stop_pips: 5.0
  min_stop_factor: 1.2
  targets:
    - {at_level_ratio: 4.0, close_fraction: 0.5}
    - {at_level_ratio: 6.0, close_fraction: 0.5}
  trail_stops:
    - {at_level_ratio: 2.0, to_level_ratio: 0.1}
  min_reward_risk: 2.0
  atr_multiplier: 2.0
meta_learner:
  families: [trend, indicator, pattern]
  theta_high: 0.55
  theta_low: 0.45
  regime_gate: false
  label_horizon_minutes: 240
execution:
  spread_pips: 1.0
  commission_per_lot: 0.0
  min_hold_bars: 0
  broker_stop_level_pips: 0.0
  close_on_veto: false
