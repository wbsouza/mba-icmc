[project]
name = "algo-transform"
version = "0.0.0"
description = "Transform raw payloads into canonical Parquet (year=YYYY/month=MM/); coverage matrix + currency-strength."
requires-python = ">=3.11"
dependencies = [
    "algo-core",
    "gdeltnews>=1.1.0",
    "pyarrow>=16",
    "typer>=0.12",
    "xlrd>=2",
]

[project.scripts]
algo-transform = "algo_transform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_transform"]

[tool.uv.sources]
algo-core = { workspace = true }
