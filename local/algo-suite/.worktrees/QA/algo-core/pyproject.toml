[project]
name = "algo-core"
version = "0.0.0"
description = "Shared core: Instrument, storage layout, DuckDB helpers, config, Repository + Cache ports."
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pyarrow>=16",
    "pydantic>=2",
    "pyyaml>=6",
    "structlog>=24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_core"]
