[project]
name = "algo-analyze"
version = "0.0.0"
description = "Run metrics: deflated Sharpe, Monte-Carlo Permutation Test, ablation tables, audit-trail queries."
requires-python = ">=3.11"
dependencies = [
    "algo-core",
    "typer>=0.12",
    "structlog>=24",
]

[project.scripts]
algo-analyze = "algo_analyze.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/algo_analyze"]

[tool.uv.sources]
algo-core = { workspace = true }

[tool.mutmut]
source_paths = ["src"]
# Scope to the deflated Sharpe task's own new file (differential Hardener gate).
only_mutate = [
    "src/algo_analyze/deflated.py",
]
