# Multi-strategy comparison experiment — two PRICE-ONLY baselines over the same window,
# so algo-analyze can union them into one Chapter-4 row-per-run table (Stage F3 / F2).
#
# NOT the thesis AI hybrid: both runs are price-only. The news/sentiment hybrid is later
# work, gated on the scoring subsystem (algo-score) — see docs/technical-debt.md / Stage G.
#
# Run (download + transform + materialize the window first):
#   uv run algo-download  run --source dukascopy --symbol EURUSD --month 2024-06
#   uv run algo-transform run --source dukascopy --symbol EURUSD --month 2024-06
#   uv run algo-backtest  materialize --symbol EURUSD --year 2024 --month 6
#   uv run algo-backtest  experiment run --spec experiments/baseline-comparison.yaml
#   uv run algo-analyze   summary
experiment: baseline-comparison
runs:
  - id: ma-eurusd-2024-06
    strategy: baseline-ma
    symbol: EURUSD
    from: 2024-06-03
    to: 2024-06-28
    params:
      fast: 20
      slow: 60
      size: 0.5
      cash: 10000
  - id: meanrev-eurusd-2024-06
    strategy: baseline-meanrev
    symbol: EURUSD
    from: 2024-06-03
    to: 2024-06-28
    params:
      window: 60
      band: 0.0015
      size: 0.5
      cash: 10000
